services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: frota
      POSTGRES_PASSWORD: frota
      POSTGRES_DB: frota
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frota -d frota"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      # Dentro da rede do compose o host do banco e o nome do servico.
      DATABASE_URL: postgresql+psycopg://frota:frota@db:5432/frota
      DEVICE_TOKEN: ${DEVICE_TOKEN:-troque-este-token}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  pgdata:
